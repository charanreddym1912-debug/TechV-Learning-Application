server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/v1/students/**

        - id: trainer-service
          uri: lb://trainer-service
          predicates:
            - Path=/api/v1/trainers/**

        - id: coordinator-service
          uri: lb://coordinator-service
          predicates:
            - Path=/api/v1/coordinators/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: course-routes
          uri: lb://coordinator-service
          predicates:
            - Path=/api/v1/courses/**

        - id: assessment-routes
          uri: lb://coordinator-service
          predicates:
            - Path=/api/v1/assessments/**,/api/v1/assessment-attempts/**,/api/v1/assessment-answers/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
