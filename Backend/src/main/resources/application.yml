server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lms-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator Configuration for health checks and observability
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# Custom application configs
app:
  jwt:
    # 256-bit base64-encoded secret key for HS256 algorithm (this is a placeholder, override in prod)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Token expiration time: 24 hours (in milliseconds)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  
  # Directory where files/assignments will be saved
  upload-dir: ${UPLOAD_DIR:./uploads}

  # Zoom API integration properties
  zoom:
    client-id: ${ZOOM_CLIENT_ID:placeholder-client-id}
    client-secret: ${ZOOM_CLIENT_SECRET:placeholder-client-secret}
    account-id: ${ZOOM_ACCOUNT_ID:placeholder-account-id}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
